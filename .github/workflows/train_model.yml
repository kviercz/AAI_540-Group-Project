name: Train and Upload Model

on:
  push:
    branches:
      - kim-test-cicd  # Run the workflow with commits to main
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  issues: write  # Needed for creating comments on issues

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute Initial_Model_cicd.ipynb --output trained_model.ipynb

      - name: Read validation accuracy
        id: validation_check
        run: |
          VAL_ACC=$(cat val_acc.txt)
          echo "Validation Accuracy: $VAL_ACC"
          if (( $(echo "$VAL_ACC >= 0.5" | bc -l) )); then
            echo "PASS_VALIDATION=true" >> $GITHUB_ENV
          else
            echo "PASS_VALIDATION=false" >> $GITHUB_ENV
          fi

      - name: Save trained model as artifact
        if: env.PASS_VALIDATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model.h5
          retention-days: 7

      - name: Debug Context
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log(context);

      - name: Post a GitHub issue comment
        if: env.PASS_VALIDATION == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,  // Issue just for tracking
              body: "A new model artifact is available: [Download here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            });
