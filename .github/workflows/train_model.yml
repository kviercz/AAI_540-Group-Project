name: Train and Upload Model

on:
  push:
    branches:
      - main  # Run the workflow with commits to main
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  issues: write  # Needed for creating comments on issues

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    outputs:
      PASS_VALIDATION: ${{ steps.validation_check.outputs.PASS_VALIDATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute Initial_Model_cicd.ipynb --output trained_model.ipynb

      - name: Read validation accuracy
        id: validation_check
        run: |
          VAL_ACC=$(cat val_acc.txt)
          echo "Validation Accuracy: $VAL_ACC"
          if (( $(echo "$VAL_ACC >= 0.5" | bc -l) )); then
            echo "PASS_VALIDATION=true" >> $GITHUB_ENV
          else
            echo "PASS_VALIDATION=false" >> $GITHUB_ENV
          fi

      - name: Save trained model as artifact
        if: env.PASS_VALIDATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model.h5
          retention-days: 7

      - name: Upload Metrics as Artifact
        if: env.PASS_VALIDATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: metrics.json
          retention-days: 7

      - name: Post a GitHub issue comment
        if: env.PASS_VALIDATION == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,  // Issue just for tracking
              body: `✅ **A new model artifact is available!**\n\n📂 [Download Model & Metrics](${runUrl})\n\n🔍 This includes:\n- [Trained Model](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=trained-model)\n- [Model Metrics](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=model-metrics)\n\n🎉 Ready for review!`
            });
