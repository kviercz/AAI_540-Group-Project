name: Train and Upload Model

on:
  push:
    branches:
      - kim-test-cicd  # Run the workflow when pushing to the main branch
  workflow_dispatch:  # Allow manual triggering

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute Initial_Model_cicd.ipynb --output trained_model.ipynb

      - name: Save trained model as artifact
        uses: actions/upload-artifact@v3
        with:
          name: trained-model
          path: models/model.h5

