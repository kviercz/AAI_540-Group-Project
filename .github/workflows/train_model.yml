name: Train and Upload Model

on:
  push:
    branches:
      - kim-test-cicd  # Run the workflow when pushing to this branch
  workflow_dispatch:  # Allow manual triggering

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute Initial_Model_cicd.ipynb --output trained_model.ipynb

      - name: Save trained model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model.h5
          retention-days: 7

  notify_maintainers:
    needs: train-and-upload
    runs-on: ubuntu-latest
    steps:
      - name: Send notification email
        env:
          EMAIL_TO: "kvierczhalek@sandiego.edu"
        run: |
          echo "New model artifact is available: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" | mail -s "New Model Available" $EMAIL_TO
